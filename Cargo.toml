[package]
name = "agy-pulse"
version = "2.0.0"
edition = "2024"
description = "Single-binary Rust statusline, context monitor, and telemetry ledger for Antigravity CLI"
license = "MIT"

[[bin]]
name = "agy-pulse"
path = "src/main.rs"

[[bin]]
name = "agypl"
path = "src/bin/agypl.rs"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.23.0"
