[package]
name = "agy-pulse"
version = "2.1.0"
edition = "2024"
description = "Single-binary Rust statusline, context monitor, and telemetry ledger for Antigravity CLI"
license = "MIT"

[[bin]]
name = "agy-pulse"
path = "src/main.rs"

[[bin]]
name = "agypl"
path = "src/bin/agypl.rs"

[dependencies]
flate2 = "1.1.4"
getrandom = "0.3.4"
hex = "0.4.3"
jiff = "1.0.3"
memchr = "2.7.6"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled", "serialize"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.18"
unicode-width = "0.2.2"
ureq = "3.3.0"
url = "2.5.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
