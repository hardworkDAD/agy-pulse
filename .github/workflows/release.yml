name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: agy-pulse-linux-x86_64.tar.gz
            is_windows: false
            use_zig: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: agy-pulse-linux-aarch64.tar.gz
            is_windows: false
            use_zig: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: agy-pulse-macos-x86_64.tar.gz
            is_windows: false
            use_zig: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: agy-pulse-macos-aarch64.tar.gz
            is_windows: false
            use_zig: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: agy-pulse-windows-x86_64.zip
            is_windows: true
            use_zig: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux musl tools
        if: matrix.os == 'ubuntu-latest' && !matrix.use_zig
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig & cargo-zigbuild for Linux ARM64 musl
        if: matrix.use_zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package Unix tarball
        if: "!matrix.is_windows"
        shell: bash
        run: |
          mkdir -p dist_stage dist_out
          cp "target/${{ matrix.target }}/release/agy-pulse" dist_stage/agy-pulse
          cp "target/${{ matrix.target }}/release/agypl" dist_stage/agypl
          strip dist_stage/agy-pulse dist_stage/agypl 2>/dev/null || true
          chmod 0755 dist_stage/agy-pulse dist_stage/agypl
          tar -czf "dist_out/${{ matrix.asset }}" -C dist_stage agy-pulse agypl

      - name: Package Windows zip
        if: matrix.is_windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_stage, dist_out | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\agy-pulse.exe" "dist_stage\agy-pulse.exe"
          Copy-Item "target\${{ matrix.target }}\release\agypl.exe" "dist_stage\agypl.exe"
          Compress-Archive -Path dist_stage\agy-pulse.exe,dist_stage\agypl.exe -DestinationPath "dist_out\${{ matrix.asset }}" -Force

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: dist_out/${{ matrix.asset }}

  publish:
    name: Generate SHA256SUMS & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all 5 target artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          ls -lh
          sha256sum \
            agy-pulse-linux-x86_64.tar.gz \
            agy-pulse-linux-aarch64.tar.gz \
            agy-pulse-macos-x86_64.tar.gz \
            agy-pulse-macos-aarch64.tar.gz \
            agy-pulse-windows-x86_64.zip \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/agy-pulse-linux-x86_64.tar.gz
            release-artifacts/agy-pulse-linux-aarch64.tar.gz
            release-artifacts/agy-pulse-macos-x86_64.tar.gz
            release-artifacts/agy-pulse-macos-aarch64.tar.gz
            release-artifacts/agy-pulse-windows-x86_64.zip
            release-artifacts/SHA256SUMS
