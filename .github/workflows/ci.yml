name: CI

on:
  push:
    branches: [main, 'feat/*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: ${{ matrix.os }} (clippy + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy (zero warnings, zero unwrap/expect)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binaries
        run: cargo build --release

      - name: Run full test suite
        run: cargo test

      - name: Verify configure-utf8 script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP 'configure-utf8'
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          $env:AGY_PULSE_PROFILE_PATH = Join-Path $tempDir 'Microsoft.PowerShell_profile.ps1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $tempDir '.gitconfig'

          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\configure-utf8.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\configure-utf8.ps1

          if (-not (Test-Path $env:AGY_PULSE_PROFILE_PATH)) {
            throw 'configure-utf8 did not create the expected profile file'
          }
          $profileText = Get-Content -Raw -Path $env:AGY_PULSE_PROFILE_PATH
          $markerCount = ([regex]::Matches($profileText, 'AGY-PULSE UTF-8 encoding setup')).Count
          if ($markerCount -ne 1) {
            throw "expected exactly one UTF-8 profile marker, got $markerCount"
          }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependencies for security advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
